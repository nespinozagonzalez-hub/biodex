,.12);pointer-events:none}.rpg-title{display:inline-block;background:#050816;border:3px solid var(--yellow);color:var(--yellow);padding:5px 10px;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px;font-weight:900;box-shadow:4px 4px 0 #000}\n.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}button,.btn{font-family:var(--font);font-weight:900;cursor:pointer;border:3px solid var(--cyan);background:#101a3c;color:var(--ink);padding:10px 12px;box-shadow:4px 4px 0 #000;text-transform:uppercase;transition:.12s}button:hover{transform:translate(-1px,-1px);filter:brightness(1.15);border-color:var(--green)}button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}button.active{border-color:var(--green);color:var(--green)}button.ghost{background:transparent;border-color:var(--line);color:var(--muted);box-shadow:none}button.danger{border-color:var(--red)}button.secondary{border-color:var(--yellow)}.nav button{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav button::before{content:\"▶ \";color:var(--green)}\ninput,select,textarea{width:100%;font-family:var(--font);background:#050816;color:var(--ink);border:3px solid var(--line);padding:12px;outline:none;box-shadow:inset 0 0 12px rgba(0,0,0,.35)}input:focus,select:focus,textarea:focus{border-color:var(--cyan)}label{display:block;color:var(--yellow);margin:10px 0 6px;font-weight:900;text-transform:uppercase;font-size:.85rem}\n.grid{display:grid;gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}\n.hero{min-height:72vh;display:grid;place-items:center}.register{width:min(900px,100%)}.terminal{color:var(--green);font-size:.95rem;line-height:1.7;background:#050816;border:2px solid var(--green);padding:12px;margin-bottom:14px;box-shadow:inset 0 0 16px rgba(77,255,145,.1)}.blink{animation:blink 1s steps(2,end) infinite}@keyframes blink{50%{opacity:.2}}\n.card{border:3px solid var(--line);background:rgba(5,8,22,.64);padding:12px;position:relative;box-shadow:4px 4px 0 rgba(0,0,0,.45);overflow-wrap:break-word}.card:hover{border-color:var(--cyan)}.card-title{font-weight:900;color:var(--cyan);text-transform:uppercase;margin-bottom:8px}.muted{color:var(--muted)}.small{font-size:.84rem;line-height:1.45}.pill{display:inline-block;border:2px solid currentColor;padding:3px 7px;margin:3px 3px 3px 0;font-size:.75rem;font-weight:900;background:rgba(0,0,0,.22)}.stamp{position:absolute;right:10px;top:10px;border:2px solid var(--green);color:var(--green);padding:4px 8px;transform:rotate(-6deg);font-size:.72rem;background:rgba(77,255,145,.08);z-index:2}\n.type-aurora{color:#ff8bd1}.type-prisma{color:#ff9d4d}.type-nexo{color:#ff5f7a}.type-nova{color:#4dff91}.type-bruma{color:#9cffd2}.type-lumen{color:#a477ff}.type-vector{color:#ffe66d}.type-umbral{color:#48e7ff}.type-arcana{color:#ff7d4d}.type-terra{color:#c7d2ff}\n.rarity-comun{border-color:#8ca3c7}.rarity-poco-comun{border-color:#4dff91;box-shadow:0 0 12px rgba(77,255,145,.12),4px 4px 0 rgba(0,0,0,.45)}.rarity-rara{border-color:#48e7ff;box-shadow:0 0 18px rgba(72,231,255,.23),4px 4px 0 rgba(0,0,0,.45)}.rarity-epica{border-color:#ff4fd8;box-shadow:0 0 20px rgba(255,79,216,.32),4px 4px 0 rgba(0,0,0,.45)}.rarity-legendaria{border-color:#ffe66d;box-shadow:0 0 24px rgba(255,230,109,.4),4px 4px 0 rgba(0,0,0,.45);animation:legend 2.3s infinite alternate}@keyframes legend{from{filter:brightness(1)}to{filter:brightness(1.22)}}\n.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:3px solid var(--line);background:rgba(5,8,22,.58);padding:12px;min-height:92px}.stat b{display:block;color:var(--yellow);font-size:.78rem;text-transform:uppercase;margin-bottom:8px}.stat span{font-size:1.25rem;color:var(--green);text-shadow:2px 2px 0 #000}.progress{height:20px;background:#050816;border:3px solid var(--line);box-shadow:inset 0 0 10px #000;overflow:hidden;margin-top:8px}.progress>div{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan),var(--mag));width:0%;transition:.4s}\n.bioforma-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}.bioforma{min-height:345px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s transform}.bioforma:hover{transform:translateY(-2px)}.bio-svg-wrap{height:125px;display:grid;place-items:center;margin:8px 0;background:linear-gradient(135deg,rgba(72,231,255,.08),rgba(255,79,216,.08));border:2px dashed rgba(255,255,255,.12);overflow:hidden}.locked .bio-svg-wrap{filter:grayscale(.85)}.evo-locked .bio-svg-wrap{opacity:.65;filter:grayscale(1)}.capture-reveal{animation:reveal 1.35s ease-in-out}@keyframes reveal{0%{filter:grayscale(1) brightness(.45);transform:scale(.88)}45%{filter:grayscale(.7) brightness(1.3);transform:scale(1.04)}100%{filter:none;transform:scale(1)}}\n.status{font-size:.76rem;font-weight:900;text-transform:uppercase;color:var(--yellow)}.bioforma .status{display:block;min-height:22px;padding-right:116px}.bioforma .stamp{top:44px;right:12px;font-size:.68rem;padding:4px 7px;white-space:nowrap;pointer-events:none}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px}\n.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:1000;display:none;align-items:center;justify-content:center;padding:18px}.modal-back.show{display:flex}.modal{width:min(890px,100%);max-height:92vh;overflow:auto}.modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}\n.dialogue{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);width:min(1000px,calc(100% - 24px));z-index:1100;display:none}.dialogue.show{display:block}.dialogue .name{display:inline-block;background:#050816;color:var(--yellow);border:3px solid var(--yellow);padding:4px 10px;margin-bottom:-3px;position:relative;z-index:2;font-weight:900}.dialogue .box{border:4px solid var(--ink);background:#090 (--muted);background:rgba(0,0,0,.18);margin-top:10px}\n.gym-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}\n.gym-code-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-top:10px}\n.gym-code-line{border:2px solid var(--line);padding:8px;background:#050816}\n@media(max-width:900px){.gym-command-row{grid-template-columns:1fr}.gym-bio-list{grid-template-columns:1fr}}\n\n\n/* === Sectores Ciudad BioNova === */\n.sector-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-top:14px}\n.sector-card{position:relative;transition:.15s}\n.sector-locked{opacity:.70}\n.sector-locked .gym-zone-svg{filter:grayscale(1) brightness(.45)!important}\n.sector-locked-panel{border:2px dashed var(--line);padding:14px 10px;text-align:center;background:rgba(0,0,0,.32);margin-top:8px;border-radius:0}\n.sector-gyms{display:flex;flex-direction:column;gap:8px}\n.gym-mini-card{border:2px solid var(--line);padding:10px;background:rgba(0,0,0,.18);transition:.12s}\n.gym-mini-card:hover{border-color:var(--cyan)}\n.gym-mini-card.gym-mini-done{border-color:var(--green);background:rgba(77,255,145,.07)}\n.gym-mini-card.gym-mini-progress{border-color:var(--yellow);background:rgba(255,230,109,.05)}\n.gym-mini-header{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}\n.gym-mini-bios{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0 4px}\n.gym-bio-pill{font-size:.7rem;padding:2px 7px;border:1.5px solid var(--line);background:rgba(0,0,0,.2);display:inline-block;font-weight:900}\n.gym-bio-pill.captured{border-color:var(--green);color:var(--green);background:rgba(77,255,145,.09)}\n.gym-bio-pill.pending{color:var(--muted)}\n@media(max-width:900px){.sector-grid{grid-template-columns:1fr}}\n\n/* ════════════════════════════════════════════\n   EPIC CAPTURE ANIMATION — BioDex v1.8\n   ════════════════════════════════════════════ */\n#captureOverlay{\n  position:fixed;inset:0;z-index:3000;background:#000;\n  display:none;flex-direction:column;\n  align-items:center;justify-content:center;overflow:hidden;\n}\n.cap-flash{position:fixed;inset:0;background:#fff;z-index:3500;pointer-events:none;\n  animation:capFlashOut .35s ease-out forwards}\n@keyframes capFlashOut{from{opacity:1}to{opacity:0}}\n\n.cap-bg{position:absolute;inset:-100%;\n  animation:capBgPulse 2.2s ease-out forwards}\n@keyframes capBgPulse{\n  0%{transform:scale(0);opacity:0}\n  35%{transform:scale(.7);opacity:.55}\n  100%{transform:scale(1.5);opacity:0}}\n\n.cap-ring{position:absolute;left:50%;top:50%;border-radius:50%;border:3px solid;\n  transform:translate(-50%,-50%);width:0;height:0;\n  animation:capRingExpand 1.6s ease-out forwards}\n@keyframes capRingExpand{\n  0%{width:0;height:0;opacity:.9}\n  100%{width:700px;height:700px;opacity:0}}\n\n.cap-stage{position:relative;z-index:10;text-align:center;padding:20px}\n.cap-svg-wrap{\n  width:220px;height:220px;margin:0 auto;position:relative;\n  display:grid;place-items:center;\n  filter:drop-shadow(0 0 32px var(--cap-glow));\n  animation:capBioReveal 2s ease-in-out forwards}\n@keyframes capBioReveal{\n  0%{filter:brightness(0) saturate(0) drop-shadow(0 0 0px #000);transform:scale(.5)}\n  20%{filter:brightness(4) saturate(0) drop-shadow(0 0 60px #fff);transform:scale(1.2)}\n  55%{filter:brightness(1.6) saturate(.6) drop-shadow(0 0 40px var(--cap-glow));transform:scale(.97)}\n  100%{filter:brightness(1) saturate(1) drop-shadow(0 0 28px var(--cap-glow));transform:scale(1)}}\n\n.cap-scanline{\n  position:absolute;left:-20%;right:-20%;height:8px;top:0;pointer-events:none;\n  background:linear-gradient(90deg,transparent,var(--cap-col),#fff,var(--cap-col),transparent);\n  box-shadow:0 0 40px 14px rgba(255,255,255,.55);\n  animation:capScan 1.15s .4s ease-in-out forwards;opacity:0}\n@keyframes capScan{\n  0%{top:-4px;opacity:1}50%{opacity:1}100%{top:100%;opacity:.2}}\n\n.cap-particle{position:absolute;border-radius:50%;pointer-events:none;\n  left:50%;top:50%;\n  animation:capParticle var(--cdur) var(--cdel) ease-out forwards;opacity:0}\n@keyframes capParticle{\n  0%{transform:translate(-50%,-50%) scale(1);opacity:1}\n  100%{transform:translate(calc(-50% + var(--cdx)),calc(-50% + var(--cdy))) scale(0);opacity:0}}\n\n.cap-name{\n  font-size:clamp(1.8rem,6vw,3.2rem);font-weight:900;letter-spacing:4px;\n  text-transform:uppercase;margin-top:18px;line-height:1.1;\n  text-shadow:4px 4px 0 #000,0 0 40px var(--cap-col);\n  animation:capNameSlam .45s 1.75s cubic-bezier(.15,.85,.25,1.4) both;opacity:0}\n@keyframes capNameSlam{\n  from{transform:scale(3.5) translateY(-15px);opacity:0;filter:blur(12px)}\n  to{transform:scale(1) translateY(0);opacity:1;filter:blur(0)}}\n\n.cap-rarity{\n  display:inline-block;border:3px solid var(--cap-col);color:var(--cap-col);\n  padding:5px 18px;font-weight:900;letter-spacing:3px;text-transform:uppercase;\n  background:rgba(0,0,0,.55);margin-top:10px;\n  box-shadow:0 0 20px var(--cap-col),4px 4px 0 #000;\n  animation:capBadgePop .35s 2.1s cubic-bezier(.15,.85,.25,1.5) both;opacity:0}\n@keyframes capBadgePop{\n  from{transform:scale(0) rotate(-8deg);opacity:0}\n  to{transform:scale(1) rotate(-2deg);opacity:1}}\n\n.cap-cta{\n  margin-top:28px;\n  animation:capNameSlam .4s 2.5s cubic-bezier(.15,.85,.25,1.3) both;opacity:0}\n.cap-cta button{\n  font-family:var(--font);font-weight:900;cursor:pointer;\n  border:3px solid var(--cap-col);background:#101a3c;color:#ecf7ff;\n  padding:14px 36px;font-size:1.05rem;letter-spacing:3px;text-transform:uppercase;\n  box-shadow:0 0 24px var(--cap-col),6px 6px 0 #000;\n  transition:.12s}\n.cap-cta button:hover{filter:brightness(1.2);transform:translate(-1px,-1px)}\n.cap-cta button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}\n\n</style>\n<link rel=\"stylesheet\" href=\"remaster.css?v=2.3.0\">\n<link rel=\"stylesheet\" href=\"retro.css?v=2.3.0\">\n<style>\n.bioforma-wrap{width:100%;display:grid;place-items:center;position:relative;isolation:isolate}\n.bioforma-wrap.tiny svg{width:92px;height:auto}\n.bioforma-wrap.card svg{width:min(180px,100%);height:auto}\n.bioforma-wrap.large svg{width:min(360px,100%);height:auto}\n.bioforma-svg{width:100%;max-width:360px;overflow:visible;filter:drop-shadow(0 0 10px rgba(72,231,255,.18))}\n.bioforma-svg .color-part,.bioforma-svg .detail,.bioforma-svg .eye,.bioforma-svg .aura{transition:fill .75s ease,stroke .75s ease,opacity .75s ease,filter .75s ease,transform .75s ease;transform-origin:center}\n.bioforma-svg .eye{fill:#06101d;stroke:none}\n.bioforma-wrap.locked .color-part{fill:#05070d!important;stroke:#1e2740!important;filter:grayscale(1) brightness(.48)}\n.bioforma-wrap.locked .detail{fill:#0b1020!important;stroke:#1e2740!important;opacity:.56}\n.bioforma-wrap.locked .eye{fill:#0d1220!important;stroke:#1e2740!important;opacity:.7}\n.bioforma-wrap.locked .aura{opacity:.08!important}\n.bioforma-wrap.locked .question-mark{opacity:1}\n.bioforma-wrap.unlocked .question-mark{opacity:0}\n.bioforma-wrap.unlocked .aura{animation:pulseBioAura 2.4s infinite ease-in-out}\n.bioforma-wrap.reveal .color-part{animation:bioReveal .95s ease both}\n.bioforma-wrap.reveal .aura{animation:pulseBioAura 2.4s infinite ease-in-out,auraPop .95s ease both}\n.bioforma-wrap.legendaria .bioforma-svg{filter:drop-shadow(0 0 18px rgba(255,230,109,.55))}\n.bioforma-wrap.epica .bioforma-svg{filter:drop-shadow(0 0 16px rgba(255,79,216,.45))}\n@keyframes pulseBioAura{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.04)}}\n@keyframes bioReveal{0%{filter:grayscale(1) brightness(.25);opacity:.45;transform:scale(.96)}55%{filter:grayscale(.3) brightness(1.6);opacity:1;transform:scale(1.03)}100%{filter:none;opacity:1;transform:scale(1)}}\n@keyframes auraPop{0%{opacity:.05;transform:scale(.75)}60%{opacity:.75;transform:scale(1.08)}100%{opacity:.35;transform:scale(1)}}\n</style></head><body><div id=\"app\" class=\"app\"><div class=\"welcome-device\"><div class=\"device-badge\"><span class=\"po x;margin-bottom:14px;box-shadow:inset 0 0 16px rgba(77,255,145,.1)}.blink{animation:blink 1s steps(2,end) infinite}@keyframes blink{50%{opacity:.2}}\n.card{border:3px solid var(--line);background:rgba(5,8,22,.64);padding:12px;position:relative;box-shadow:4px 4px 0 rgba(0,0,0,.45);overflow-wrap:break-word}.card:hover{border-color:var(--cyan)}.card-title{font-weight:900;color:var(--cyan);text-transform:uppercase;margin-bottom:8px}.muted{color:var(--muted)}.small{font-size:.84rem;line-height:1.45}.pill{display:inline-block;border:2px solid currentColor;padding:3px 7px;margin:3px 3px 3px 0;font-size:.75rem;font-weight:900;background:rgba(0,0,0,.22)}.stamp{position:absolute;right:10px;top:10px;border:2px solid var(--green);color:var(--green);padding:4px 8px;transform:rotate(-6deg);font-size:.72rem;background:rgba(77,255,145,.08);z-index:2}\n.type-aurora{color:#ff8bd1}.type-prisma{color:#ff9d4d}.type-nexo{color:#ff5f7a}.type-nova{color:#4dff91}.type-bruma{color:#9cffd2}.type-lumen{color:#a477ff}.type-vector{color:#ffe66d}.type-umbral{color:#48e7ff}.type-arcana{color:#ff7d4d}.type-terra{color:#c7d2ff}\n.rarity-comun{border-color:#8ca3c7}.rarity-poco-comun{border-color:#4dff91;box-shadow:0 0 12px rgba(77,255,145,.12),4px 4px 0 rgba(0,0,0,.45)}.rarity-rara{border-color:#48e7ff;box-shadow:0 0 18px rgba(72,231,255,.23),4px 4px 0 rgba(0,0,0,.45)}.rarity-epica{border-color:#ff4fd8;box-shadow:0 0 20px rgba(255,79,216,.32),4px 4px 0 rgba(0,0,0,.45)}.rarity-legendaria{border-color:#ffe66d;box-shadow:0 0 24px rgba(255,230,109,.4),4px 4px 0 rgba(0,0,0,.45);animation:legend 2.3s infinite alternate}@keyframes legend{from{filter:brightness(1)}to{filter:brightness(1.22)}}\n.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:3px solid var(--line);background:rgba(5,8,22,.58);padding:12px;min-height:92px}.stat b{display:block;color:var(--yellow);font-size:.78rem;text-transform:uppercase;margin-bottom:8px}.stat span{font-size:1.25rem;color:var(--green);text-shad v1.8\n   ════════════════════════════════════════════ */\n#captureOverlay{\n  position:fixed;inset:0;z-index:3000;background:#000;\n  display:none;flex-direction:column;\n  align-items:center;justify-content:center;overflow:hidden;\n}\n.cap-flash{position:fixed;inset:0;background:#fff;z-index:3500;pointer-events:none;\n  animation:capFlashOut .35s ease-out forwards}\n@keyframes capFlashOut{from{opacity:1}to{opacity:0}}\n\n.cap-bg{position:absolute;inset:-100%;\n  animation:capBgPulse 2.2s ease-out forwards}\n@keyframes capBgPulse{\n  0%{transform:scale(0);opacity:0}\n  35%{transform:scale(.7);opacity:.55}\n  100%{transform:scale(1.5);opacity:0}}\n\n.cap-ring{position:absolute;left:50%;top:50%;border-radius:50%;border:3px solid;\n  transform:translate(-50%,-50%);width:0;height:0;\n  animation:capRingExpand 1.6s ease-out forwards}\n@keyframes capRingExpand{\n  0%{width:0;height:0;opacity:.9}\n  100%{width:700px;height:700px;opacity:0}}\n\n.cap-stage{position:relative;z-index:10;text-align:center;padding:20px}\n.cap-svg-wrap{\n  width:220px;height:220px;margin:0 auto;position:relative;\n  display:grid;place-items:center;\n  filter:drop-shadow(0 0 32px var(--cap-glow));\n  animation:capBioReveal 2s ease-in-out forwards}\n@keyframes capBioReveal{\n  0%{filter:brightness(0) saturate(0) drop-shadow(0 0 0px #000);transform:scale(.5)}\n  20%{filter:brightness(4) saturate(0) drop-shadow(0 0 60px #fff);transform:scale(1.2)}\n  55%{filter:brightness(1.6) saturate(.6) drop-shadow(0 0 40px var(--cap-glow));transform:scale(.97)}\n  100%{filter:brightness(1) saturate(1) drop-shadow(0 0 28px var(--cap-glow));transform:scale(1)}}\n\n.cap-scanline{\n  position:absolute;left:-20%;right:-20%;height:8px;top:0;pointer-events:none;\n  background:linear-gradient(90deg,transparent,var(--cap-col),#fff,var(--cap-col),transparent);\n  box-shadow:0 0 40px 14px rgba(255,255,255,.55);\n  animation:capScan 1.15s .4s ease-in-out forwards;opacity:0}\n@keyframes capScan{\n  0%{top:-4px;opacity:1}50%{o
