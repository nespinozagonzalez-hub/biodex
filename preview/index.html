<title>BioDex · Crónicas de BioNova</title>
<style>
:root {
  --bg:#070a16; --panel:#11152e; --panel2:#1b2147; --ink:#ecf7ff; --muted:#a7b4d8;
  --green:#4dff91; --cyan:#48e7ff; --mag:#ff4fd8; --yellow:#ffe66d; --red:#ff5f7a;
  --line:#38427d; --font:"Courier New","Lucida Console",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--font);color:var(--ink);background:radial-gradient(circle at top,#263278 0%,#0b1027 42%,#04060d 100%);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:34px 34px;animation:grid 14s linear infinite}
@keyframes grid{from{transform:translateY(0)}to{transform:translateY(34px)}}
body.crt::after{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.02) 50%,rgba(0,0,0,.07) 50%);background-size:100% 4px;mix-blend-mode:screen;z-index:999}
.particles{position:fixed;inset:0;pointer-events:none;opacity:.35;background:radial-gradient(circle at 10% 20%,rgba(72,231,255,.7) 0 1px,transparent 2px),radial-gradient(circle at 80% 30%,rgba(255,79,216,.7) 0 1px,transparent 2px),radial-gradient(circle at 40% 78%,rgba(255,230,109,.7) 0 1px,transparent 2px);animation:drift 18s infinite alternate linear}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-28px)}}
.app{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:18px 14px 120px}
.boot-screen{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;background:radial-gradient(circle at top,#1e2b66,#050712)}
.boot-panel{width:min(820px,92vw);padding:20px;border:4px solid var(--green);background:#03060f;box-shadow:0 0 35px rgba(77,255,145,.22),8px 8px 0 #000}
.boot-title{font-size:1.6rem;color:var(--green);text-shadow:2px 2px 0 #000;margin-bottom:10px;font-weight:900}
.boot-line{min-height:1.45em;color:#c8ffd9}.boot-bar{height:20px;border:3px solid var(--line);background:#03060f;margin-top:14px;overflow:hidden}.boot-bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--cyan),var(--mag));transition:width .35s}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.logo{width:56px;height:56px;border:4px solid var(--cyan);display:grid;place-items:center;background:#0d1533;color:var(--green);font-weight:900;font-size:24px;text-shadow:2px 2px 0 #000;box-shadow:0 0 18px rgba(72,231,255,.55),inset 0 0 12px rgba(72,231,255,.25)}
h1,h2,h3,p{margin-top:0}h1{font-size:clamp(1.45rem,4vw,2.7rem);letter-spacing:2px;text-shadow:3px 3px 0 #000,0 0 16px rgba(72,231,255,.65);margin:0}.subtitle{color:var(--muted);font-size:.9rem}.tag{border:2px solid var(--line);padding:7px 10px;background:rgba(10,15,36,.82);color:var(--yellow);font-size:.82rem}
.rpg-window{background:linear-gradient(180deg,rgba(27,33,71,.96),rgba(13,17,43,.96));border:4px solid var(--cyan);box-shadow:0 0 0 2px rgba(255,255,255,.08),0 0 24px rgba(72,231,255,.18),7px 7px 0 rgba(0,0,0,.6);padding:16px;position:relative}
.rpg-window::before{content:"";position:absolute;inset:5px;border:1px solid rgba(255,255,255,.12);pointer-events:none}.rpg-title{display:inline-block;background:#050816;border:3px solid var(--yellow);color:var(--yellow);padding:5px 10px;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px;font-weight:900;box-shadow:4px 4px 0 #000}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}button,.btn{font-family:var(--font);font-weight:900;cursor:pointer;border:3px solid var(--cyan);background:#101a3c;color:var(--ink);padding:10px 12px;box-shadow:4px 4px 0 #000;text-transform:uppercase;transition:.12s}button:hover{transform:translate(-1px,-1px);filter:brightness(1.15);border-color:var(--green)}button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}button.active{border-color:var(--green);color:var(--green)}button.ghost{background:transparent;border-color:var(--line);color:var(--muted);box-shadow:none}button.danger{border-color:var(--red)}button.secondary{border-color:var(--yellow)}.nav button{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav button::before{content:"▶ ";color:var(--green)}
input,select,textarea{width:100%;font-family:var(--font);background:#050816;color:var(--ink);border:3px solid var(--line);padding:12px;outline:none;box-shadow:inset 0 0 12px rgba(0,0,0,.35)}input:focus,select:focus,textarea:focus{border-color:var(--cyan)}label{display:block;color:var(--yellow);margin:10px 0 6px;font-weight:900;text-transform:uppercase;font-size:.85rem}
.grid{display:grid;gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.hero{min-height:72vh;display:grid;place-items:center}.register{width:min(900px,100%)}.terminal{color:var(--green);font-size:.95rem;line-height:1.7;background:#050816;border:2px solid var(--green);padding:12px;margin-bottom:14px;box-shadow:inset 0 0 16px rgba(77,255,145,.1)}.blink{animation:blink 1s steps(2,end) infinite}@keyframes blink{50%{opacity:.2}}
.card{border:3px solid var(--line);background:rgba(5,8,22,.64);padding:12px;position:relative;box-shadow:4px 4px 0 rgba(0,0,0,.45);overflow-wrap:break-word}.card:hover{border-color:var(--cyan)}.card-title{font-weight:900;color:var(--cyan);text-transform:uppercase;margin-bottom:8px}.muted{color:var(--muted)}.small{font-size:.84rem;line-height:1.45}.pill{display:inline-block;border:2px solid currentColor;padding:3px 7px;margin:3px 3px 3px 0;font-size:.75rem;font-weight:900;background:rgba(0,0,0,.22)}.stamp{position:absolute;right:10px;top:10px;border:2px solid var(--green);color:var(--green);padding:4px 8px;transform:rotate(-6deg);font-size:.72rem;background:rgba(77,255,145,.08);z-index:2}
.type-aurora{color:#ff8bd1}.type-prisma{color:#ff9d4d}.type-nexo{color:#ff5f7a}.type-nova{color:#4dff91}.type-bruma{color:#9cffd2}.type-lumen{color:#a477ff}.type-vector{color:#ffe66d}.type-umbral{color:#48e7ff}.type-arcana{color:#ff7d4d}.type-terra{color:#c7d2ff}
.rarity-comun{border-color:#8ca3c7}.rarity-poco-comun{border-color:#4dff91;box-shadow:0 0 12px rgba(77,255,145,.12),4px 4px 0 rgba(0,0,0,.45)}.rarity-rara{border-color:#48e7ff;box-shadow:0 0 18px rgba(72,231,255,.23),4px 4px 0 rgba(0,0,0,.45)}.rarity-epica{border-color:#ff4fd8;box-shadow:0 0 20px rgba(255,79,216,.32),4px 4px 0 rgba(0,0,0,.45)}.rarity-legendaria{border-color:#ffe66d;box-shadow:0 0 24px rgba(255,230,109,.4),4px 4px 0 rgba(0,0,0,.45);animation:legend 2.3s infinite alternate}@keyframes legend{from{filter:brightness(1)}to{filter:brightness(1.22)}}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:3px solid var(--line);background:rgba(5,8,22,.58);padding:12px;min-height:92px}.stat b{display:block;color:var(--yellow);font-size:.78rem;text-transform:uppercase;margin-bottom:8px}.stat span{font-size:1.25rem;color:var(--green);text-shadow:2px 2px 0 #000}.progress{height:20px;background:#050816;border:3px solid var(--line);box-shadow:inset 0 0 10px #000;overflow:hidden;margin-top:8px}.progress>div{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan),var(--mag));width:0%;transition:.4s}
.bioforma-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}.bioforma{min-height:345px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s transform}.bioforma:hover{transform:translateY(-2px)}.bio-svg-wrap{height:125px;display:grid;place-items:center;margin:8px 0;background:linear-gradient(135deg,rgba(72,231,255,.08),rgba(255,79,216,.08));border:2px dashed rgba(255,255,255,.12);overflow:hidden}.locked .bio-svg-wrap{filter:grayscale(.85)}.evo-locked .bio-svg-wrap{opacity:.65;filter:grayscale(1)}.capture-reveal{animation:reveal 1.35s ease-in-out}@keyframes reveal{0%{filter:grayscale(1) brightness(.45);transform:scale(.88)}45%{filter:grayscale(.7) brightness(1.3);transform:scale(1.04)}100%{filter:none;transform:scale(1)}}
.status{font-size:.76rem;font-weight:900;text-transform:uppercase;color:var(--yellow)}.bioforma .status{display:block;min-height:22px;padding-right:116px}.bioforma .stamp{top:44px;right:12px;font-size:.68rem;padding:4px 7px;white-space:nowrap;pointer-events:none}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:1000;display:none;align-items:center;justify-content:center;padding:18px}.modal-back.show{display:flex}.modal{width:min(890px,100%);max-height:92vh;overflow:auto}.modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.dialogue{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);width:min(1000px,calc(100% - 24px));z-index:1100;display:none}.dialogue.show{display:block}.dialogue .name{display:inline-block;background:#050816;color:var(--yellow);border:3px solid var(--yellow);padding:4px 10px;margin-bottom:-3px;position:relative;z-index:2;font-weight:900}.dialogue .box{border:4px solid var(--ink);background:#090d25;padding:16px;min-height:105px;box-shadow:0 0 24px rgba(72,231,255,.25),7px 7px 0 rgba(0,0,0,.75);line-height:1.55}.dialogue .controls{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.zone-node{min-height:285px}.zone-svg{height:120px;border:2px solid var(--line);background:#050816;margin-bottom:10px;overflow:hidden}.node-top{display:flex;align-items:center;gap:10px}.node-icon{width:42px;height:42px;border:3px solid var(--cyan);display:grid;place-items:center;background:#050816;color:var(--green);box-shadow:0 0 15px rgba(72,231,255,.2)}.inventory{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.slot{min-height:160px;text-align:center;border-style:dashed;padding:14px}
.achievement.unlocked{border-color:var(--green);background:rgba(77,255,145,.08)}.achievement.locked{filter:grayscale(.8);opacity:.65}.toast{position:fixed;top:18px;right:18px;background:#050816;border:3px solid var(--green);color:var(--ink);padding:12px;box-shadow:5px 5px 0 #000;z-index:1200;display:none;max-width:340px}.toast.show{display:block;animation:pop .18s}@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.terminal-lines{background:#050816;border:2px solid var(--line);padding:12px;line-height:1.6;min-height:140px}.terminal-lines .ok{color:var(--green)}.terminal-lines .info{color:var(--cyan)}.terminal-lines .warn{color:var(--yellow)}.meter{display:grid;grid-template-columns:115px 1fr 42px;gap:8px;align-items:center;margin:8px 0}.meter b{font-size:.8rem;color:var(--yellow)}.meter-bar{height:14px;border:2px solid var(--line);background:#050816;overflow:hidden}.meter-bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));width:0}
.footer-note{margin-top:14px;color:var(--muted);font-size:.8rem;line-height:1.5}.question-note{border-left:3px solid var(--cyan);padding-left:10px;color:var(--muted)}
@media(max-width:900px){.grid.two,.grid.three,.grid.four{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.nav{grid-template-columns:repeat(2,1fr)!important}.stats-row{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}.meter{grid-template-columns:92px 1fr 38px}}

/* === Gimnasios BioNova integrados === */
.gym-command-row{display:grid;grid-template-columns:1fr auto;gap:10px;margin:12px 0 6px}
.gym-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-top:14px}
.gym-card{min-height:100%;padding-top:12px}
.gym-status-pill{position:absolute;right:12px;top:12px;border:2px solid var(--yellow);color:var(--yellow);background:#050816;padding:4px 8px;font-size:.68rem;font-weight:900;transform:rotate(-4deg);z-index:5;white-space:nowrap}
.gym-status-open{border-color:var(--cyan);color:var(--cyan)}
.gym-status-progress{border-color:var(--yellow);color:var(--yellow)}
.gym-status-complete{border-color:var(--green);color:var(--green)}
.gym-status-closed{border-color:var(--red);color:var(--red)}
.gym-zone-svg{height:145px;border:2px dashed rgba(255,255,255,.12);background:linear-gradient(135deg,rgba(72,231,255,.07),rgba(255,79,216,.06));display:grid;place-items:center;margin-bottom:12px;overflow:hidden}
.gym-zone-svg svg{width:100%;height:145px;display:block}
.gym-bio-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.gym-bio-token{border:2px solid var(--line);background:rgba(0,0,0,.24);padding:8px;min-height:104px;text-align:center;display:grid;align-content:center;gap:4px}
.gym-bio-token.locked{filter:grayscale(1);opacity:.62}
.gym-bio-token.done{border-color:var(--green);box-shadow:0 0 12px rgba(77,255,145,.18)}
.gym-bio-mini{height:50px;display:grid;place-items:center}
.gym-bio-mini .bioforma-wrap.tiny svg{width:54px}
.gym-card.closed .gym-bio-list{display:none}
.gym-locked-panel{border:2px dashed var(--line);padding:10px;text-align:center;color:var(--muted);background:rgba(0,0,0,.18);margin-top:10px}
.gym-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.gym-code-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-top:10px}
.gym-code-line{border:2px solid var(--line);padding:8px;background:#050816}
@media(max-width:900px){.gym-command-row{grid-template-columns:1fr}.gym-bio-list{grid-template-columns:1fr}}


/* === Sectores Ciudad BioNova === */
.sector-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-top:14px}
.sector-card{position:relative;transition:.15s}
.sector-locked{opacity:.70}
.sector-locked .gym-zone-svg{filter:grayscale(1) brightness(.45)!important}
.sector-locked-panel{border:2px dashed var(--line);padding:14px 10px;text-align:center;background:rgba(0,0,0,.32);margin-top:8px;border-radius:0}
.sector-gyms{display:flex;flex-direction:column;gap:8px}
.gym-mini-card{border:2px solid var(--line);padding:10px;background:rgba(0,0,0,.18);transition:.12s}
.gym-mini-card:hover{border-color:var(--cyan)}
.gym-mini-card.gym-mini-done{border-color:var(--green);background:rgba(77,255,145,.07)}
.gym-mini-card.gym-mini-progress{border-color:var(--yellow);background:rgba(255,230,109,.05)}
.gym-mini-header{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.gym-mini-bios{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0 4px}
.gym-bio-pill{font-size:.7rem;padding:2px 7px;border:1.5px solid var(--line);background:rgba(0,0,0,.2);display:inline-block;font-weight:900}
.gym-bio-pill.captured{border-color:var(--green);color:var(--green);background:rgba(77,255,145,.09)}
.gym-bio-pill.pending{color:var(--muted)}
@media(max-width:900px){.sector-grid{grid-template-columns:1fr}}

/* ════════════════════════════════════════════
   EPIC CAPTURE ANIMATION — BioDex v1.8
   ════════════════════════════════════════════ */
#captureOverlay{
  position:fixed;inset:0;z-index:3000;background:#000;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;overflow:hidden;
}
.cap-flash{position:fixed;inset:0;background:#fff;z-index:3500;pointer-events:none;
  animation:capFlashOut .35s ease-out forwards}
@keyframes capFlashOut{from{opacity:1}to{opacity:0}}

.cap-bg{position:absolute;inset:-100%;
  animation:capBgPulse 2.2s ease-out forwards}
@keyframes capBgPulse{
  0%{transform:scale(0);opacity:0}
  35%{transform:scale(.7);opacity:.55}
  100%{transform:scale(1.5);opacity:0}}

.cap-ring{position:absolute;left:50%;top:50%;border-radius:50%;border:3px solid;
  transform:translate(-50%,-50%);width:0;height:0;
  animation:capRingExpand 1.6s ease-out forwards}
@keyframes capRingExpand{
  0%{width:0;height:0;opacity:.9}
  100%{width:700px;height:700px;opacity:0}}

.cap-stage{position:relative;z-index:10;text-align:center;padding:20px}
.cap-svg-wrap{
  width:220px;height:220px;margin:0 auto;position:relative;
  display:grid;place-items:center;
  filter:drop-shadow(0 0 32px var(--cap-glow));
  animation:capBioReveal 2s ease-in-out forwards}
@keyframes capBioReveal{
  0%{filter:brightness(0) saturate(0) drop-shadow(0 0 0px #000);transform:scale(.5)}
  20%{filter:brightness(4) saturate(0) drop-shadow(0 0 60px #fff);transform:scale(1.2)}
  55%{filter:brightness(1.6) saturate(.6) drop-shadow(0 0 40px var(--cap-glow));transform:scale(.97)}
  100%{filter:brightness(1) saturate(1) drop-shadow(0 0 28px var(--cap-glow));transform:scale(1)}}

.cap-scanline{
  position:absolute;left:-20%;right:-20%;height:8px;top:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--cap-col),#fff,var(--cap-col),transparent);
  box-shadow:0 0 40px 14px rgba(255,255,255,.55);
  animation:capScan 1.15s .4s ease-in-out forwards;opacity:0}
@keyframes capScan{
  0%{top:-4px;opacity:1}50%{opacity:1}100%{top:100%;opacity:.2}}

.cap-particle{position:absolute;border-radius:50%;pointer-events:none;
  left:50%;top:50%;
  animation:capParticle var(--cdur) var(--cdel) ease-out forwards;opacity:0}
@keyframes capParticle{
  0%{transform:translate(-50%,-50%) scale(1);opacity:1}
  100%{transform:translate(calc(-50% + var(--cdx)),calc(-50% + var(--cdy))) scale(0);opacity:0}}

.cap-name{
  font-size:clamp(1.8rem,6vw,3.2rem);font-weight:900;letter-spacing:4px;
  text-transform:uppercase;margin-top:18px;line-height:1.1;
  text-shadow:4px 4px 0 #000,0 0 40px var(--cap-col);
  animation:capNameSlam .45s 1.75s cubic-bezier(.15,.85,.25,1.4) both;opacity:0}
@keyframes capNameSlam{
  from{transform:scale(3.5) translateY(-15px);opacity:0;filter:blur(12px)}
  to{transform:scale(1) translateY(0);opacity:1;filter:blur(0)}}

.cap-rarity{
  display:inline-block;border:3px solid var(--cap-col);color:var(--cap-col);
  padding:5px 18px;font-weight:900;letter-spacing:3px;text-transform:uppercase;
  background:rgba(0,0,0,.55);margin-top:10px;
  box-shadow:0 0 20px var(--cap-col),4px 4px 0 #000;
  animation:capBadgePop .35s 2.1s cubic-bezier(.15,.85,.25,1.5) both;opacity:0}
@keyframes capBadgePop{
  from{transform:scale(0) rotate(-8deg);opacity:0}
  to{transform:scale(1) rotate(-2deg);opacity:1}}

.cap-cta{
  margin-top:28px;
  animation:capNameSlam .4s 2.5s cubic-bezier(.15,.85,.25,1.3) both;opacity:0}
.cap-cta button{
  font-family:var(--font);font-weight:900;cursor:pointer;
  border:3px solid var(--cap-col);background:#101a3c;color:#ecf7ff;
  padding:14px 36px;font-size:1.05rem;letter-spacing:3px;text-transform:uppercase;
  box-shadow:0 0 24px var(--cap-col),6px 6px 0 #000;
  transition:.12s}
.cap-cta button:hover{filter:brightness(1.2);transform:translate(-1px,-1px)}
.cap-cta button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}

</style>

function getBioformaSVGData(input){

function slugCssBioforma(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

function stat(label,value){return `<div class="stat"><b>${label}</b><span>${value}</span></div>`;}
function getRango(c){if(c>=30)return"Archivista legendario";if(c>=25)return"Maestro BioDex";if(c>=20)return"Guardián BioNova";if(c>=15)return"Rastreador avanzado";if(c>=10)return"Investigador BioNova";if(c>=5)return"Explorador inicial";return"Aspirante";}
function getRarezaAlta(){const caps=BIOFORMAS.filter(b=>progreso.capturadas.includes(b.id));if(!caps.length)return"Ninguna";return caps.sort((a,b)=>RARITY_ORDER.indexOf(b.rareza)-RARITY_ORDER.indexOf(a.rareza))[0].rareza;}
function renderBiodex(){const tipos=[...new Set(BIOFORMAS.map(b=>b.tipo))],oas=[...new Set(BIOFORMAS.map(b=>b.oa))];return `<section class="rpg-window"><span class="rpg-title">Archivo BioDex</span><div class="filters"><input placeholder="Buscar por nombre, tipo, ruta o zona..." value="${escapeHtml(searchTerm)}" oninput="searchTerm=this.value; document.getElementById('bioformaGrid').innerHTML=renderBioformaCards()"><select onchange="filterStatus=this.value; document.getElementById('bioformaGrid').innerHTML=renderBioformaCards()">${opt("todos","Todos",filterStatus)}${opt("capturada","Capturadas",filterStatus)}${opt("disponible","Disponibles",filterStatus)}${opt("evo","Evolución bloqueada",filterStatus)}</select><select onchange="filterTipo=this.value; document.getElementById('bioformaGrid').innerHTML=renderBioformaCards()">${opt("todos","Todos los tipos",filterTipo)}${tipos.map(t=>opt(t,t,filterTipo)).join("")}</select><select onchange="filterOA=this.value; document.getElementById('bioformaGrid').innerHTML=renderBioformaCards()">${opt("todos","Todas las rutas",filterOA)}${oas.map(o=>opt(o,o,filterOA)).join("")}</select></div><div id="bioformaGrid" class="bioforma-grid">${renderBioformaCards()}</div></section>`;}
function opt(v,t,sel){return `<option value="${v}" ${v===sel?'selected':''}>${t}</option>`;}
function estadoBioforma(b){if(progreso.capturadas.includes(b.id))return"capturada";if(!canCaptureEvolution(b))return"evo";return"disponible";}
function renderBioformaCards(){const term=searchTerm.trim().toLowerCase();return BIOFORMAS.filter(b=>{const st=estadoBioforma(b);if(filterStatus==="capturada"&&st!=="capturada")return false;if(filterStatus==="disponible"&&st!=="disponible")return false;if(filterStatus==="evo"&&st!=="evo")return false;if(filterTipo!=="todos"&&b.tipo!==filterTipo)return false;if(filterOA!=="todos"&&b.oa!==filterOA)return false;if(term&&!(b.nombre.toLowerCase().includes(term)||b.tipo.toLowerCase().includes(term)||b.oa.toLowerCase().includes(term)||b.zona.toLowerCase().includes(term)))return false;return true;}).map(bioformaCard).join("")||`<p class="muted">No hay resultados con esos filtros.</p>`;}
function bioformaCard(b){const st=estadoBioforma(b),captured=st==="capturada",cls=captured?`rarity-${slugCss(b.rareza)}`:(st==="evo"?"evo-locked locked":"locked");return `<article class="card bioforma ${cls}" onclick="renderFicha('${b.id}')"><div>${captured?'<div class="stamp">CAPTURADA</div>':st==="disponible"?'<div class="stamp" style="border-color:var(--cyan);color:var(--cyan)">SILUETA</div>':'<div class="stamp" style="border-color:var(--yellow);color:var(--yellow)">EVOLUCIÓN</div>'}<div class="status">B${b.num} · Etapa ${b.etapa} · ${labelEstado(st)}</div><div class="bio-svg-wrap">${renderBioformaSVG(b,captured,130)}</div><div class="card-title">${b.nombre}</div><span class="pill type-${slugCss(b.tipo)}">${b.tipo}</span><span class="pill">${b.oa}</span><span class="pill">${b.rareza}</span><p class="small muted">${captured?b.descE:(st==="disponible"?'Silueta detectada. Usa el código de misión para intentar captura.':'Requiere capturar la etapa anterior de la línea evolutiva.')}</p></div><button class="ghost">Ver ficha</button></article>`;}
function labelEstado(st){return st==="capturada"?"Capturada":st==="evo"?"Evolución bloqueada":"Disponible";}
function renderFicha(id){const b=getBioforma(id),st=estadoBioforma(b),captured=st==="capturada",evo=lineaBioformas(b.linea).map(x=>`${progreso.capturadas.includes(x.id)?x.icon||'●':'?'} ${x.nombre}`).join(" → ");openModal(`<span class="rpg-title">Ficha de Bioforma</span><h2>${b.nombre}</h2><div class="bio-svg-wrap" style="height:180px">${renderBioformaSVG(b,captured,190)}</div><p class="status">B${b.num} · ${b.oa} · Etapa ${b.etapa} · ${labelEstado(st)}</p><p><span class="pill type-${slugCss(b.tipo)}">${b.tipo}</span><span class="pill">${b.rareza}</span><span class="pill">Zona: ${b.zona}</span></p><p><b>Descripción narrativa:</b> ${b.descN}</p>${captured?`<p><b>Esencia de la bioforma:</b> ${b.descE}</p><p><b>Habilidad:</b> ${b.habilidad}</p>${renderStats(b.stats)}`:`<p class="muted">${st==="disponible"?'Completa la misión asociada y usa el código de captura. La Bioforma se revelará a color al validar el código.':'Esta Bioforma evolutiva está bloqueada hasta capturar la etapa anterior.'}</p>`}<p><b>Línea evolutiva:</b> ${evo}</p><p class="question-note">El docente entrega los códigos según las actividades de su asignatura. No hay preguntas dentro de BioDex.</p><div class="modal-actions"><button onclick="closeModal()">Cerrar</button></div>`);}
function renderStats(stats){return `<div>${Object.entries(stats).map(([k,v])=>`<div class="meter"><b>${capitalize(k)}</b><div class="meter-bar"><div style="width:${Math.min(100,v)}%"></div></div><span>${v}</span></div>`).join("")}</div>`;}
function normalizarCodigo(c){return String(c||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]/g,"");}
function secuenciaCaptura(b){
  const RARITY_COLORS = {
    'Común':'#8ca3c7','Poco común':'#4dff91','Rara':'#48e7ff',
    'Épica':'#ff4fd8','Legendaria':'#ffe66d','Mega legendaria':'#f2cf7c'
  };
  const col = RARITY_COLORS[b.rareza] || '#48e7ff';
  // Buscar el glow del SVG data
  const svgData = (typeof BIOFORMAS_SVG_DATA !== 'undefined')
    ? BIOFORMAS_SVG_DATA.find(x=>x.id===b.id) : null;
  const glow = svgData?.colors?.glow || col;

  // ── Flash blanco ──────────────────────────────────────────────────────────
  const flash = document.createElement('div');
  flash.className = 'cap-flash';
  document.body.appendChild(flash);
  setTimeout(()=>flash.remove(), 400);

  // ── Construir overlay ─────────────────────────────────────────────────────
  const ov = document.getElementById('captureOverlay');
  ov.style.cssText = `--cap-col:${col};--cap-glow:${glow}`;
  ov.style.display = 'flex';

  // Fondo radial animado
  const bg = document.createElement('div');
  bg.className = 'cap-bg';
  bg.style.background = `radial-gradient(circle,${glow}55 0%,${col}22 35%,transparent 65%)`;
  ov.appendChild(bg);

  // Anillos expansivos
  [col, '#ffffff', glow].forEach((c,i)=>{
    const r = document.createElement('div');
    r.className = 'cap-ring';
    r.style.cssText = `border-color:${c};animation-delay:${i*0.22}s`;
    ov.appendChild(r);
  });

  // Partículas
  for(let p=0; p<32; p++){
    const angle = (p/32)*Math.PI*2 + Math.random()*0.2;
    const dist = 100 + Math.random()*240;
    const size = 5 + Math.random()*11;
    const el = document.createElement('div');
    el.className = 'cap-particle';
    el.style.cssText = `
      width:${size}px;height:${size}px;
      background:${[col,'#fff',glow,'#48e7ff','#ff4fd8'][p%5]};
      --cdx:${Math.cos(angle)*dist}px;--cdy:${Math.sin(angle)*dist}px;
      --cdur:${.7+Math.random()*.9}s;--cdel:${.25+Math.random()*.5}s;
      box-shadow:0 0 ${Math.round(size*1.5)}px ${[col,glow,'#fff'][p%3]};
    `;
    ov.appendChild(el);
  }

  // Stage central
  const stage = document.createElement('div');
  stage.className = 'cap-stage';
  stage.innerHTML = `
    <div class="cap-svg-wrap" style="--cap-glow:${glow}">
      ${renderBioformaSVG(b, true, 210)}
      <div class="cap-scanline" style="--cap-col:${col}"></div>
    </div>
    <div class="cap-name" style="color:${col}">${b.nombre}</div>
    <div><span class="cap-rarity" style="--cap-col:${col}">${b.rareza}</span></div>
    <div class="cap-cta">
      <button onclick="cerrarCapturaOverlay('${b.id}')">▶ Ver en BioDex</button>
    </div>`;
  ov.appendChild(stage);
}

function cerrarCapturaOverlay(bioId){
  const ov = document.getElementById('captureOverlay');
  ov.style.transition = 'opacity .35s';
  ov.style.opacity = '0';
  setTimeout(()=>{
    ov.style.display = 'none';
    ov.style.opacity = '';
    ov.style.transition = '';
    ov.innerHTML = '';
    const b = getBioforma(bioId);
    if(!b) return;
    openModal(`
      <span class="rpg-title">¡Bioforma registrada!</span>
      <h2>${b.nombre}</h2>
      <div class="bio-svg-wrap capture-reveal" style="height:180px">${renderBioformaSVG(b,true,190)}</div>
      <p><span class="pill type-${slugCss(b.tipo)}">${b.tipo}</span>
         <span class="pill">${b.rareza}</span>
         <span class="pill">Zona: ${b.zona}</span></p>
      <p class="muted">${b.descE}</p>
      ${renderStats(b.stats)}
      <div class="modal-actions">
        <button onclick="closeModal(); go('biodex')">▦ Ver BioDex</button>
        <button class="ghost" onclick="closeModal(); go('panel')">⌂ Panel</button>
      </div>`);
  }, 380);
}

function mensajeCaptura(b){
  const msgs = {
    'Mega legendaria':`¡Distinción única! ${b.nombre} reconoce tu trayectoria en el curso.`,
    Legendaria:`¡Registro legendario! ${b.nombre} marca un hito en tu trayectoria.`,
    Épica:`¡Hallazgo épico! ${b.nombre} es una captura extraordinaria.`,
  };
  const msg = msgs[b.rareza] || (b.etapa===3&&lineaBioformas(b.linea).every(x=>progreso.capturadas.includes(x.id))
    ? `¡Línea completa! ${b.nombre} cierra una ruta entera de misiones.`
    : `${b.nombre} ya forma parte de tu BioDex. ¡Sigue explorando!`);
  setTimeout(()=>showNPC("Dra. Lira", msg), 200);
}

function zoneCard(z){const cap=z.bioformas.filter(id=>progreso.capturadas.includes(id)).length,pct=Math.round((cap/z.bioformas.length)*100),estado=pct===100?"Sector completado":pct>0?"Exploración en curso":"Sin registros";return `<article class="card zone-node"><div class="zone-svg">${renderZonaSVG(z.theme, pct===100?"completado":pct>0?"progreso":"cerrado")}</div><div class="node-top"><div class="node-icon">${z.icon}</div><div><div class="card-title">${z.nombre}</div><span class="pill">${estado}</span></div></div><p class="small muted" style="margin-top:10px">${z.desc}</p><div class="progress"><div style="width:${pct}%"></div></div></article>`;}

function actualizarLogros(notify){const before=progreso.logros.length,add=id=>{if(!progreso.logros.includes(id))progreso.logros.push(id);},c=BIOFORMAS.filter(b=>progreso.capturadas.includes(b.id)).length,caps=BIOFORMAS.filter(b=>progreso.capturadas.includes(b.id));if(c>=1)add("L01");if(c>=5)add("L02");if(c>=10)add("L03");if(c>=15)add("L04");if(c>=20)add("L05");if(c>=25)add("L06");if(c>=30)add("L07");if(caps.some(b=>b.etapa===2))add("L08");const lineas=[...new Set(BIOFORMAS.map(b=>b.linea))];if(lineas.some(l=>lineaBioformas(l).every(b=>progreso.capturadas.includes(b.id))))add("L09");if(caps.some(b=>b.rareza==="Épica"))add("L10");if(caps.some(b=>b.rareza==="Legendaria"))add("L11");if(caps.some(b=>["Aurora","Prisma","Nexo","Nova","Bruma","Lumen"].includes(b.tipo))&&caps.some(b=>["Vector","Umbral","Arcana","Terra"].includes(b.tipo)))add("L12");if(progreso.logros.length!==before){guardarProgreso();if(notify)toast("Nuevo logro desbloqueado.");}}

const BIOFORMAS_GYM = BIOFORMAS;

/* === Funciones Sector Ciudad BioNova === */

function ensureSectorProgress(){
  if(!progreso.sectores) progreso.sectores = {abiertos:{}};
  if(!progreso.sectores.abiertos) progreso.sectores.abiertos = {};
}


function getSectorEstado(sector){
  ensureSectorProgress();
  if(!progreso.sectores.abiertos[sector.id]) return "bloqueado";
  const allBios = sector.gimnasios.flatMap(g => g.bioformas);
  const captured = allBios.filter(id => progreso.capturadas.includes(id)).length;
  if(captured === allBios.length) return "completado";
  if(captured > 0) return "progreso";
  return "activo";
}

function renderSectorCard(sector){
  ensureSectorProgress();
  const estado = getSectorEstado(sector);
  const bloqueado = estado === "bloqueado";
  const allBios = sector.gimnasios.flatMap(g => g.bioformas);
  const capturedCount = allBios.filter(id => progreso.capturadas.includes(id)).length;
  const pct = allBios.length > 0 ? Math.round(capturedCount/allBios.length*100) : 0;
  const estadoLabels = {bloqueado:"BLOQUEADO", activo:"ACTIVO", progreso:"EN PROGRESO", completado:"COMPLETADO"};
  const estadoClasses = {bloqueado:"gym-status-closed", activo:"gym-status-open", progreso:"gym-status-progress", completado:"gym-status-complete"};
  return `<article class="card sector-card${bloqueado?' sector-locked':''}" data-sector="${sector.id}">
    <div class="gym-status-pill ${estadoClasses[estado]}">${estadoLabels[estado]}</div>
    <div class="gym-zone-svg">${renderZonaSVG(sector.theme, estado)}</div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <div class="node-icon">${sector.icono}</div>
      <div class="card-title" style="margin-bottom:0">${sector.nombre}</div>
    </div>
    <p class="small muted" style="margin-bottom:10px">${sector.desc}</p>
    ${bloqueado
      ? `<div class="sector-locked-panel">
           <div style="font-size:1.8rem;margin-bottom:6px;opacity:.6">🔒</div>
           <p class="small muted" style="margin:0">Sector bloqueado.<br>El profesor entregará el código de activación.</p>
         </div>`
      : `<div class="progress" style="margin-bottom:6px"><div style="width:${pct}%"></div></div>
         <p class="small muted" style="margin-bottom:10px">${capturedCount} / ${allBios.length} Bioformas capturadas · ${pct}%</p>
         <div class="sector-gyms">${sector.gimnasios.map(g => renderGymMiniCard(g)).join("")}</div>`
    }
  </article>`;
}

function renderGymMiniCard(gym){
  const captured = gym.bioformas.filter(id => progreso.capturadas.includes(id)).length;
  const total = gym.bioformas.length;
  const done = captured === total;
  const inProg = captured > 0 && !done;
  const stateClass = done ? "gym-mini-done" : inProg ? "gym-mini-progress" : "";
  const stateIcon = done ? "✓" : inProg ? "◉" : "○";
  const iconColor = done ? "var(--green)" : inProg ? "var(--yellow)" : "var(--muted)";
  return `<div class="gym-mini-card ${stateClass}">
    <div class="gym-mini-header">
      <span style="color:${iconColor};font-size:.95rem">${stateIcon}</span>
      <b style="font-size:.82rem">${gym.nombre}</b>
      <span class="pill" style="margin-left:auto;font-size:.66rem;padding:2px 5px">${gym.dificultad}</span>
    </div>
    <p class="small muted" style="margin:4px 0 6px;font-size:.74rem">${gym.objetivo}</p>
    <div class="gym-mini-bios">
      ${gym.bioformas.map(id => {
        const b = getBioforma(id);
        const cap = progreso.capturadas.includes(id);
        return `<span class="gym-bio-pill${cap?' captured':' pending'}">${b ? b.nombre : id}</span>`;
      }).join("")}
    </div>
    <div style="text-align:right;margin-top:6px">
      <button class="ghost" style="font-size:.72rem;padding:5px 8px;box-shadow:none" onclick="go('codigo')">⌘ Capturar</button>
    </div>
  </div>`;
}

function ensureGymProgress(){
  if(!progreso.gimnasios) progreso.gimnasios = {abiertos:{}};
  if(!progreso.gimnasios.abiertos) progreso.gimnasios.abiertos = {};
}

function normalizarCodigoGimnasio(c){
  return String(c || "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]/g,"");
}


function getGymProgress(gym){
  const captured = progreso.capturadas || [];
  const count = gym.bioformas.filter(id => captured.includes(id)).length;
  return {count, total:gym.bioformas.length, pct:Math.round(count/gym.bioformas.length*100)};
}

function getGymEstado(gym){
  ensureGymProgress();
  if(!progreso.gimnasios.abiertos[gym.id]) return "cerrado";
  const p = getGymProgress(gym);
  if(p.count === 0) return "abierto";
  if(p.count < p.total) return "progreso";
  return "completado";
}

function gymEstadoLabel(estado){ return {cerrado:"CERRADO",abierto:"ABIERTO",progreso:"EN PROGRESO",completado:"COMPLETADO"}[estado] || estado; }
function gymEstadoClass(estado){ return {cerrado:"gym-status-closed",abierto:"gym-status-open",progreso:"gym-status-progress",completado:"gym-status-complete"}[estado] || ""; }

function renderGimnasiosBioNova(){
  ensureGymProgress();
  return `<div class="card" style="margin-top:4px">
    <span class="rpg-title">Gimnasios BioNova</span>
    <h2>Ciudad BioNova: rutas de exploración</h2>
    <p class="muted">Cada gimnasio representa una actividad liberada por tu profesor. El código de inicio lo entrega el profesor y permite abrir el gimnasio. Luego, cuando la actividad esté completada, el profesor entregará los códigos de captura correspondientes.</p>
    <div class="gym-command-row">
      <input id="gymCodeInput" placeholder="Ingresa el código de inicio entregado por tu profesor" onkeydown="if(event.key==='Enter') validarCodigoGimnasio()">
      <button onclick="validarCodigoGimnasio()">Abrir gimnasio</button>
    </div>
    <div class="gym-actions">
      <button class="ghost" onclick="go('codigo')">Ir a terminal de captura</button>
    </div>
    <div class="gym-grid">${GIMNASIOS_BIONOVA.map(renderGymCard).join("")}</div>
  </div>`;
}

function renderGymCard(gym){
  const estado = getGymEstado(gym);
  const abierto = estado !== "cerrado";
  const p = getGymProgress(gym);
  return `<article class="card gym-card ${estado}" data-gym="${gym.id}">
    <div class="gym-status-pill ${gymEstadoClass(estado)}">${gymEstadoLabel(estado)}</div>
    <div class="gym-zone-svg">${renderZonaSVG(gym.theme, estado)}</div>
    <div class="card-title">${gym.nombre}</div>
    <p class="small muted"><b>${gym.zona}</b> · ${gym.dificultad}</p>
    <p class="small">${gym.narrativa}</p>
    <p class="small muted"><b>Objetivo:</b> ${gym.objetivo}</p>
    <div class="progress"><div style="width:${abierto ? p.pct : 0}%"></div></div>
    <p class="small muted">${abierto ? `${p.count} / ${p.total} Bioformas registradas` : "Ingresa el código de inicio para revelar sus Bioformas."}</p>
    ${abierto ? renderBioformasGym(gym) : `<div class="gym-locked-panel">Gimnasio bloqueado<br>Requiere código de inicio de actividad.</div>`}
    <div class="gym-actions">${abierto ? `<button onclick="verDetalleGym('${gym.id}')">Ver gimnasio</button><button class="ghost" onclick="go('codigo')">Ir a captura</button>` : `<button class="ghost" onclick="enfocarCodigoGimnasio()">Ingresar código</button>`}</div>
  </article>`;
}

function renderBioformasGym(gym){
  const captured = progreso.capturadas || [];
  return `<div class="gym-bio-list">${gym.bioformas.map(id => {
    const b = BIOFORMAS_GYM.find(x => x.id === id) || getBioforma(id);
    const done = captured.includes(id);
    return `<div class="gym-bio-token ${done ? "done" : "locked"}">
      <div class="gym-bio-mini">${typeof renderBioformaSVG === "function" ? renderBioformaSVG(getBioforma(id)||b, done, 54) : renderMiniBioformaGym(done)}</div>
      <b>${b.nombre}</b><span class="pill">${done ? "capturada" : "pendiente"}</span>
    </div>`;
  }).join("")}</div>`;
}

function renderMiniBioformaGym(done){
  if(done) return `<svg viewBox="0 0 100 90" aria-hidden="true"><ellipse cx="50" cy="45" rx="34" ry="31" fill="#4dff91" opacity=".25"/><path d="M50 12 C76 28,80 62,50 80 C20 62,24 28,50 12Z" fill="#48e7ff" stroke="#071023" stroke-width="5"/></svg>`;
  return `<svg viewBox="0 0 100 90" aria-hidden="true"><ellipse cx="50" cy="45" rx="34" ry="31" fill="#000" opacity=".5"/><path d="M50 12 C76 28,80 62,50 80 C20 62,24 28,50 12Z" fill="#070912" stroke="#1e2740" stroke-width="5"/><text x="50" y="57" text-anchor="middle" fill="#e8f0ff" font-size="34" font-family="monospace" font-weight="900">?</text></svg>`;
}

function enfocarCodigoGimnasio(){ const input=document.getElementById("gymCodeInput"); if(input){ input.focus(); input.scrollIntoView({behavior:"smooth",block:"center"}); } }

function mostrarCodigosInicio(){
  openModal(`<span class="rpg-title">Códigos de inicio</span><h2>Información</h2><p class="muted">Los códigos de inicio y captura son entregados directamente por el profesor durante las actividades.</p><div class="gym-actions"><button onclick="closeModal()">Cerrar</button></div>`);
}

function verDetalleGym(id){
  const gym = GIMNASIOS_BIONOVA.find(g => g.id === id);
  const p = getGymProgress(gym);
  const bios = gym.bioformas.map(id => BIOFORMAS_GYM.find(b => b.id === id) || getBioforma(id));
  openModal(`<span class="rpg-title">${gym.nombre}</span><h2>${gym.zona}</h2><p class="muted">${gym.narrativa}</p><p><b>Objetivo:</b> ${gym.objetivo}</p><p><b>Progreso:</b> ${p.count} / ${p.total} Bioformas capturadas</p><div class="progress"><div style="width:${p.pct}%"></div></div><h3 style="margin-top:14px">Bioformas de este gimnasio</h3><div class="gym-code-list">${bios.map(b => `<div class="gym-code-line"><b>${b.id} · ${b.nombre}</b><br><span class="muted">Código CAP entregado por el profesor al completar la actividad.</span></div>`).join("")}</div><div class="gym-actions"><button onclick="closeModal()">Cerrar</button><button class="ghost" onclick="closeModal(); go('codigo')">Ir a captura</button></div>`);
}
