5,.09)}\n.gym-bio-pill.pending{color:var(--muted)}\n@media(max-width:900px){.sector-grid{grid-template-columns:1fr}}\n\n/* ════════════════════════════════════════════\n   EPIC CAPTURE ANIMATION — BioDex v1.8\n   ════════════════════════════════════════════ */\n#captureOverlay{\n  position:fixed;inset:0;z-index:3000;background:#000;\n  display:none;flex-direction:column;\n  align-items:center;justify-content:center;overflow:hidden;\n}\n.cap-flash{position:fixed;inset:0;background:#fff;z-index:3500;pointer-events:none;\n  animation:capFlashOut .35s ease-out forwards}\n@keyframes capFlashOut{from{opacity:1}to{opacity:0}}\n\n.cap-bg{position:absolute;inset:-100%;\n  animation:capBgPulse 2.2s ease-out forwards}\n@keyframes capBgPulse{\n  0%{transform:scale(0);opacity:0}\n  35%{transform:scale(.7);opacity:.55}\n  100%{transform:scale(1.5);opacity:0}}\n\n.cap-ring{position:absolute;left:50%;top:50%;border-radius:50%;border:3px solid;\n  transform:translate(-50%,-50%);width:0;height:0;\n  animation:capRingExpand 1.6s ease-out forwards}\n@keyframes capRingExpand{\n  0%{width:0;height:0;opacity:.9}\n  100%{width:700px;height:700px;opacity:0}}\n\n.cap-stage{position:relative;z-index:10;text-align:center;padding:20px}\n.cap-svg-wrap{\n  width:220px;height:220px;margin:0 auto;position:relative;\n  display:grid;place-items:center;\n  filter:drop-shadow(0 0 32px var(--cap-glow));\n  animation:capBioReveal 2s ease-in-out forwards}\n@keyframes capBioReveal{\n  0%{filter:brightness(0) saturate(0) drop-shadow(0 0 0px #000);transform:scale(.5)}\n  20%{filter:brightness(4) saturate(0) drop-shadow(0 0 60px #fff);transform:scale(1.2)}\n  55%{filter:brightness(1.6) saturate(.6) drop-shadow(0 0 40px var(--cap-glow));transform:scale(.97)}\n  100%{filter:brightness(1) saturate(1) drop-shadow(0 0 28px var(--cap-glow));transform:scale(1)}}\n\n.cap-scanline{\n  position:absolute;left:-20%;right:-20%;height:8px;top:0;pointer-events:none;\n  background:linear-gradient(90deg,transparent,var(--cap-col),#fff,var(--cap-col),transparent);\n  box-shadow:0 0 40px 14px rgba(255,255,255,.55);\n  animation:capScan 1.15s .4s ease-in-out forwards;opacity:0}\n@keyframes capScan{\n  0%{top:-4px;opacity:1}50%{opacity:1}100%{top:100%;opacity:.2}}\n\n.cap-particle{position:absolute;border-radius:50%;pointer-events:none;\n  left:50%;top:50%;\n  animation:capParticle var(--cdur) var(--cdel) ease-out forwards;opacity:0}\n@keyframes capParticle{\n  0%{transform:translate(-50%,-50%) scale(1);opacity:1}\n  100%{transform:translate(calc(-50% + var(--cdx)),calc(-50% + var(--cdy))) scale(0);opacity:0}}\n\n.cap-name{\n  font-size:clamp(1.8rem,6vw,3.2rem);font-weight:900;letter-spacing:4px;\n  text-transform:uppercase;margin-top:18px;line-height:1.1;\n  text-shadow:4px 4px 0 #000,0 0 40px var(--cap-col);\n  animation:capNameSlam .45s 1.75s cubic-bezier(.15,.85,.25,1.4) both;opacity:0}\n@keyframes capNameSlam{\n  from{transform:scale(3.5) translateY(-15px);opacity:0;filter:blur(12px)}\n  to{transform:scale(1) translateY(0);opacity:1;filter:blur(0)}}\n\n.cap-rarity{\n  display:inline-block;border:3px solid var(--cap-col);color:var(--cap-col);\n  padding:5px 18px;font-weight:900;letter-spacing:3px;text-transform:uppercase;\n  background:rgba(0,0,0,.55);margin-top:10px;\n  box-shadow:0 0 20px var(--cap-col),4px 4px 0 #000;\n  animation:capBadgePop .35s 2.1s cubic-bezier(.15,.85,.25,1.5) both;opacity:0}\n@keyframes capBadgePop{\n  from{transform:scale(0) rotate(-8deg);opacity:0}\n  to{transform:scale(1) rotate(-2deg);opacity:1}}\n\n.cap-cta{\n  margin-top:28px;\n  animation:capNameSlam .4s 2.5s cubic-bezier(.15,.85,.25,1.3) both;opacity:0}\n.cap-cta button{\n  font-family:var(--font);font-weight:900;cursor:pointer;\n  border:3px solid var(--cap-col);background:#101a3c;color:#ecf7ff;\n  padding:14px 36px;font-size:1.05rem;letter-spacing:3px;text-transform:uppercase;\n  box-shadow:0 0 24px var(--cap-col),6px 6px 0 #000;\n  transition:.12s}\n.cap-cta button:hover{filter:brightness(1.2);transform:translate(-1px,-1px)}\n.cap-cta button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}\n\n</style>\n<link rel=\"stylesheet\" href=\"remaster.css?v=2.4.0\">\n<link rel=\"stylesheet\" href=\"retro.css?v=2.4.0\">\n<link rel=\"stylesheet\" href=\"territorios.css?v=2.4.1\">\n<link rel=\"stylesheet\" href=\"narrativa.css?v=2.4.2\">\n<style>\n.bioforma-wrap{width:100%;display:grid;place-items:center;position:relative;isolation:isolate}\n.bioforma-wrap.tiny svg{width:92px;height:auto}\n.bioforma-wrap.card svg{width:min(180px,100%);height:auto}\n.bioforma-wrap.large svg{width:min(360px,100%);height:auto}\n.bioforma-svg{width:100%;max-width:360px;overflow:visible;filter:drop-shadow(0 0 10px rgba(72,231,255,.18))}\n.bioforma-svg .color-part,.bioforma-svg .detail,.bioforma-svg .eye,.bioforma-svg .aura{transition:fill .75s ease,stroke .75s ease,opacity .75s ease,filter .75s ease,transform .75s ease;transform-origin:center}\n.bioforma-svg .eye{fill:#06101d;stroke:none}\n.bioforma-wrap.locked .color-part{fill:#05070d!important;stroke:#1e2740!important;filter:grayscale(1) brightness(.48)}\n.bioforma-wrap.locked .detail{fill:#0b1020!important;stroke:#1e2740!important;opacity:.56}\n.bioforma-wrap.locked .eye{fill:#0d1220!important;stroke:#1e2740!important;opacity:.7}\n.bioforma-wrap.locked .aura{opacity:.08!important}\n.bioforma-wrap.locked .question-mark{opacity:1}\n.bioforma-wrap.unlocked .question-mark{opacity:0}\n.bioforma-wrap.unlocked .aura{animation:pulseBioAura 2.4s infinite ease-in-out}\n.bioforma-wrap.reveal .color-part{animation:bioReveal .95s ease both}\n.bioforma-wrap.reveal .aura{animation:pulseBioAura 2.4s infinite ease-in-out,auraPop .95s ease both}\n.bioforma-wrap.legendaria .bioforma-svg{filter:drop-shadow(0 0 18px rgba(255,230,109,.55))}\n.bioforma-wrap.epica .bioforma-svg{filter:drop-shadow(0 0 16px rgba(255,79,216,.45))}\n@keyframes pulseBioAura{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.04)}}\n@keyframes bioReveal{0%{filter:grayscale(1) brightness(.25);opacity:.45;transform:scale(.96)}55%{filter:grayscale(.3) brightness(1.6);opacity:1;transform:scale(1.03)}100%{filter:none;opacity:1;transform:scale(1)}}\n@keyframes auraPop{0%{opacity:.05;transform:scale(.75)}60%{opacity:.75;transform:scale(1.08)}100%{opacity:.35;transform:scale(1)}}\n</style></head><body><div id=\"app\" class=\"app\"><div class=\"field-device\"><header class=\"device-header\"><div class=\"brand\"><div class=\"device-lens\" aria-hidden=\"true\"><i></i></div><div><h1>BioDex<span> FIELD-02</span></h1><div class=\"subtitle\">DISPOSITIVO DE EXPLORACIÓN / BIONOVA</div></div></div><div class=\"header-signals\"><span><i class=\"power-led\"></i> EN LÍNEA</span><button class=\"ghost\">Salir ↗</button></div></header><div class=\"device-layout\"><aside class=\"explorer-sidebar\"><button class=\"explorer-card\" aria-label=\"Personalizar explorador\"><div class=\"avatar-monitor\"><img class=\"avatar-sprite\" src=\"assets/avatars/aurora.png\" alt=\"Avatar Aurora\" loading=\"lazy\"><span class=\"avatar-coordinates\">ID / AURORA</span></div><strong>Exploradora Ada</strong><small>Aspirante</small><span class=\"edit-profile\">EDITAR PERFIL ↗</span></button><nav class=\"nav\" aria-label=\"Exploración\"><button class=\"active\">⌂ Refugio</button><button class=\"\">▦ BioDex</button><button class=\"\">✧ Capturar</button><button class=\"\">⌖ Territorios</button><button class=\"\">◇ Gimnasios</button><button class=\"\">⇄ Evoluciones</button><button class=\"\">▣ Mochila</button><button class=\"\">★ Logros</button><button class=\"\">? Guía</button></nav><div class=\"sidebar-counter\"><b>01</b><span>/ 30<br>BIOFORMAS</span><div class=\"progress\"><div style=\"width:3%\"></div></div></div></aside><section class=\"device-screen\"><div class=\"screen-status\"><span>⌖ Bosque Aurora</span><span id=\"cloudStatus\" role=\"status\">Sin sesión</span><button class=\"ghost\" aria-label=\"Actualizar progreso\">↻</button></div><main id=\"view\"><se ═══════════════════════════ */\n#captureOverlay{\n  position:fixed;inset:0;z-index:3000;background:#000;\n  display:none;flex-direction:column;\n  align-items:center;justify-content:center;overflow:hidden;\n}\n.cap-flash{position:fixed;inset:0;background:#fff;z-index:3500;pointer-events:none;\n  animation:capFlashOut .35s ease-out forwards}\n@keyframes capFlashOut{from{opacity:1}to{opacity:0}}\n\n.cap-bg{position:absolute;inset:-100%;\n  animation:capBgPulse 2.2s ease-out forwards}\n@keyframes capBgPulse{\n  0%{transform:scale(0);opacity:0}\n  35%{transform:scale(.7);opacity:.55}\n  100%{transform:scale(1.5);opacity:0}}\n\n.cap-ring{position:absolute;left:50%;top:50%;border-radius:50%;border:3px solid;\n  transform:translate(-50%,-50%);width:0;height:0;\n  animation:capRingExpand 1.6s ease-out forwards}\n@keyframes capRingExpand{\n  0%{width:0;height:0;opacity:.9}\n  100%{width:700px;height:700px;opacity:0}}\n\n.cap-stage{position:relative;z-index:10;text-align:center;padding:20px}\n.cap-svg-wrap{\n  width:220px;height:220px;margin:0 auto;position:relative;\n  display:grid;place-items:center;\n  filter:drop-shadow(0 0 32px var(--cap-glow));\n  animation:capBioReveal 2s ease-in-out forwards}\n@keyframes capBioReveal{\n  0%{filter:brightness(0) saturate(0) drop-shadow(0 0 0px #000);transform:scale(.5)}\n  20%{filter:brightness(4) saturate(0) drop-shadow(0 0 60px #fff);transform:scale(1.2)}\n  55%{filter:brightness(1.6) saturate(.6) drop-shadow(0 0 40px var(--cap-glow));transform:scale(.97)}\n  100%{filter:brightness(1) saturate(1) drop-shadow(0 0 28px var(--cap-glow));transform:scale(1)}}\n\n.cap-scanline{\n  position:absolute;left:-20%;right:-20%;height:8px;top:0;pointer-events:none;\n  background:linear-gradient(90deg,transparent,var(--cap-col),#fff,var(--cap-col),transparent);\n  box-shadow:0 0 40px 14px rgba(255,255,255,.55);\n  animation:capScan 1.15s .4s ease-in-out forwards;opacity:0}\n@keyframes capScan{\n  0%{top:-4px;opacity:1}50%{opacity:1}100%{top:100%;opa %);width:0;height:0;\n  animation:capRingExpand 1.6s ease-out forwards}\n@keyframes capRingExpand{\n  0%{width:0;height:0;opacity:.9}\n  100%{width:700px;height:700px;opacity:0}}\n\n.cap-stage{position:relative;z-index:10;text-align:center;padding:20px}\n.cap-svg-wrap{\n  width:220px;height:220px;margin:0 auto;position:relative;\n  display:grid;place-items:center;\n  filter:drop-shadow(0 0 32px var(--cap-glow));\n  animation:capBioReveal 2s ease-in-out forwards}\n@keyframes capBioReveal{\n  0%{filter:brightness(0) saturate(0) drop-shadow(0 0 0px #000);transform:scale(.5)}\n  20%{filter:brightness(4) saturate(0) drop-shadow(0 0 60px #fff);transform:scale(1.2)}\n  55%{filter:brightness(1.6) saturate(.6) drop-shadow(0 0 40px var(--cap-glow));transform:scale(.97)}\n  100%{filter:brightness(1) saturate(1) drop-shadow(0 0 28px var(--cap-glow));transform:scale(1)}}\n\n.cap-scanline{\n  position:absolute;left:-20%;right:-20%;height:8px;top:0;pointer-events:none;\n  background:linear-gradient(90deg,transparent,var(--cap-col),#fff,var(--cap-col),transparent);\n  box-shadow:0 0 40px 14px rgba(255,255,255,.55);\n  animation:capScan 1.15s .4s ease-in-out forwards;opacity:0}\n@keyframes capScan{\n  0%{top:-4px;opacity:1}50%{opacity:1}100%{top:100%;opacity:.2}}\n\n.cap-particle{position:absolute;border-radius:50%;pointer-events:none;\n  left:50%;top:50%;\n  animation:capParticle var(--cdur) var(--cdel) ease-out forwards;opacity:0}\n@keyframes capParticle{\n  0%{transform:translate(-50%,-50%) scale(1);opacity:1}\n  100%{transform:translate(calc(-50% + var(--cdx)),calc(-50% + var(--cdy))) scale(0);opacity:0}}\n\n.cap-name{\n  font-size:clamp(1.8rem,6vw,3.2rem);font-weight:900;letter-spacing:4px;\n  text-transform:uppercase;margin-top:18px;line-height:1.1;\n  text-shadow:4px 4px 0 #000,0 0 40px var(--cap-col);\n  animation:capNameSlam .45s 1.75s cubic-bezier(.15,.85,.25,1.4) both;opacity:0}\n@keyframes capNameSlam{\n  from{transform:scale(3.5) translateY(-15px);opacity:0;filter:blur( var(--line);padding:8px;background:#050816}\n@media(max-width:900px){.gym-command-row{grid-template-columns:1fr}.gym-bio-list{grid-template-columns:1fr}}\n\n\n/* === Sectores Ciudad BioNova === */\n.sector-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-top:14px}\n.sector-card{position:relative;transition:.15s}\n.sector-locked{opacity:.70}\n.sector-locked .gym-zone-svg{filter:grayscale(1) brightness(.45)!important}\n.sector-locked-panel{border:2px dashed var(--line);padding:14px 10px;text-align:center;background:rgba(0,0,0,.32);margin-top:8px;border-radius:0}\n.sector-gyms{display:flex;flex-direction:column;gap:8px}\n.gym-mini-card{border:2px solid var(--line);padding:10px;background:rgba(0,0,0,.18);transition:.12s}\n.gym-mini-card:hover{border-color:var(--cyan)}\n.gym-mini-card.gym-mini-done{border-color:var(--green);background:rgba(77,255,145,.07)}\n.gym-mini-card.gym-mini-progress{border-color:var(--yellow);background:rgba(255,230,109,.05)}\n.gym-mini-header{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}\n.gym-mini-bios{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0 4px}\n.gym-bio-pill{font-size:.7rem;padding:2px 7px;border:1.5px solid var(--line);background:rgba(0,0,0,.2);display:inline-block;font-weight:900}\n.gym-bio-pill.captured{border-color:var(--green);color:var(--green);background:rgba(77,255,145,.09)}\n.gym-bio-pill.pending{color:var(--muted)}\n@media(max-width:900px){.sector-grid{grid-template-columns:1fr}}\n\n/* ════════════════════════════════════════════\n   EPIC CAPTURE ANIMATION — BioDex v1.8\n   ════════════════════════════════════════════ */\n#captureOverlay{\n  position:fixed;inset:0;z-index:3000;background:#000;\n  display:none;flex-direction:column;\n  align-items:center;justify-content:center;overflow:hidden;\n}\n.cap-flash{position:fixed;inset:0;background:#fff;z-index:3500;pointer-events:none;\n  animation:capFlashOut .35s ease-out forwards}\n@keyframes capFlashOut{from{opacity:1}to{opacity:0}}\n\n.cap-bg{position:absolute;inset:-100%;\n  animation:capBgPulse 2.2s ease-out forwards}\n@keyframes capBgPulse{\n  0%{transform:scale(0);opacity:0}\n  35%{transform:scale(.7);opacity:.55}\n  100%{transform:scale(1.5);opacity:0}}\n\n.cap-ring{position:absolute;left:50%;top:50%;border-radius:50%;border:3px solid;\n  transform:translate(-50%,-50%);width:0;height:0;\n  animation:capRingExpand 1.6s ease-out forwards}\n@keyframes capRingExpand{\n  0%{width:0;height:0;opacity:.9}\n  100%{width:700px;height:700px;opacity:0}}\n\n.cap-stage{position:relative;z-index:10;text-align:center;padding:20px}\n.cap-svg-wrap{\n  width:220px;height:220px;margin:0 auto;position:relative;\n  display:grid;place-items:center;\n  filter:drop-shadow(0 0 32px var(--cap-glow));\n  animation:capBioReveal 2s ease-in-out forwards}\n@keyframes capBioReveal{\n  0%{filter:brightness(0) saturate(0) drop-shadow(0 0 0px #000);transform:scale(.5)}\n  20%{filter:brightness(4) saturate(0) drop-shadow(0 0 60px #fff);transform:scale(1.2)}\n  55%{filter:brightness(1.6) saturate(.6) drop-shadow(0 0 40px var(--cap-glow));transform:scale(.97)}\n  100%{filter:brightness(1) saturate(1) drop-shadow(0 0 28px var(--cap-glow));transform:scale(1)}}\n\n.cap-scanline{\n  position:absolute;left:-20%;right:-20%;height:8px;top:0;pointer-events:none;\n  background:linear-gradient(90deg,transparent,var(--cap-col),#fff,var(--cap-col),transparent);\n  box-shadow:0 0 40px 14px rgba(255,255,255,.55);\n  animation:capScan 1.15s .4s ease-in-out forwards;opacity:0}\n@keyframes capScan{\n  0%{top:-4px;opacity:1}50%{opacity:1}100%{top:100%;opacity:.2}}\n\n.cap-particle{position:absolute;border-radius:50%;pointer-events:none;\n  left:50%;top:50%;\n  animation:capParticle var(--cdur) var(--cdel) ease-out forwards;opacity:0}\n@keyframes capParticle{\n  0%{transform:translate(-50%,-50%) scale(1);opacity:1}\n  100%{transform:translate(calc(-50% + var(--cdx)),calc(-50% + var(--cdy))) scale(0);opacity:0}}\n\n.cap-name{\n  font-size:clamp(1.8rem,6vw,3.2rem);font-weight:900;letter-spacing:4px;\n  text-transform:uppercase;margin-top:18px;line-height:1.1;\n  text-shadow:4px 4px 0 #000,0 0 40px var(--cap-col);\n  animation:capNameSlam .45s 1.75s cubic-bezier(.15,.85,.25,1.4) both;opacity:0}\n@keyframes capNameSlam{\n  from{transform:scale(3.5) translateY(-15px);opacity:0;filter:blur(12px)}\n  to{transform:scale(1) translateY(0);opacity:1;filter:blur(0)}}\n\n.cap-rarity{\n  display:inline-block;border:3px solid var(--cap-col);color:var(--cap-col);\n  padding:5px 18px;font-weight:900;letter-spacing:3px;text-transform:uppercase;\n  background:rgba(0,0,0,.55);margin-top:10px;\n  box-shadow:0 0 20px var(--cap-col),4px 4px 0 #000;\n  animation:capBadgePop .35s 2.1s cubic-bezier(.15,.85,.25,1.5) both;opacity:0}\n@keyframes capBadgePop{\n  from{transform:scale(0) rotate(-8deg);opacity:0}\n  to{transform:scale(1) rotate(-2deg);opacity:1}}\n\n.cap-cta{\n  margin-top:28px;\n  animation:capNameSlam .4s 2.5s cubic-bezier(.15,.85,.25,1.3) both;opacity:0}\n.cap-cta button{\n  font-family:var(--font);font-weight:900;cursor:pointer;\n  border:3px solid var(--cap-col);background:#101a3c;color:#ecf7ff;\n  padding:14px 36px;font-size:1.05rem;letter-spacing:3px;text-transform:uppercase;\n  box-shadow:0 0 24px var(--cap-col),6px 6px 0 #000;\n  transition:.12s}\n.cap-cta button:hover{filter:brightness(1.2);transform:translate(-1px,-1px)}\n.cap-cta button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}\n\n</style>\n<link rel=\"stylesheet\" href=\"remaster.css?v=2.4.0\">\n<link rel=\"stylesheet\" href=\"retro.css?v=2.4.0\">\n<link rel=\"stylesheet\" href=\"territorios.css?v=2.4.1\">\n<link rel=\"stylesheet\" href=\"narrativa.css?v=2.4.2\">\n<style>\n.bioforma-wrap{width:100%;display:grid;place-items:center;position:relative;isolation:isolate}\n.bioforma-wrap.tiny svg{width:92px;height:auto}\n.bioforma-wrap.card svg{width:min(180px,100%);height:auto}\n.bioforma-wrap.large svg{width:min(360px,100%);height:auto}\n.bioforma-svg{width:100%;max-width:360px;overflow:visible;filter:drop-shadow(0 0 10px rgba(72,231,255,.18))}\n.bioforma-svg .color-part,.bioforma-svg .detail,.bioforma-svg .eye,.bioforma-svg .aura{transition:fill .75s ease,stroke .75s ease,opacity .75s ease,filter .75s ease,transform .75s ease;transform-origin:center}\n.bioforma-svg .eye{fill:#06101d;stroke:none}\n.bioforma-wrap.locked .color-part{fill:#05070d!important;stroke:#1e2740!important;filter:grayscale(1) brightness(.48)}\n.bioforma-wrap.locked .detail{fill:#0b1020!important;stroke:#1e2740!important;opacity:.56}\n.bioforma-wrap.locked .eye{fill:#0d1220!important;stroke:#1e2740!important;opacity:.7}\n.bioforma-wrap.locked .aura{opacity:.08!important}\n.bioforma-wrap.locked .question-mark{opacity:1}\n.bioforma-wrap.unlocked .question-mark{opacity:0}\n.bioforma-wrap.unlocked .aura{animation:pulseBioAura 2.4s infinite ease-in-out}\n.bioforma-wrap.reveal .color-part{animation:bioReveal .95s ease both}\n.bioforma-wrap.reveal .aura{animation:pulseBioAura 2.4s infinite ease-in-out,auraPop .95s ease both}\n.bioforma-wrap.legendaria .bioforma-svg{filter:drop-shadow(0 0 18px rgba(255,230,109,.55))}\n.bioforma-wrap.epica .bioforma-svg{filter:drop-shadow(0 0 16px rgba(255,79,216,.45))}\n@keyframes pulseBioAura{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.04)}}\n@keyframes bioReveal{0%{filter:grayscale(1) brightness(.25);opacity:.45;transform:scale(.96)}55%{filter:grayscale(.3) brightness(1.6);opacity:1;transform:scale(1.03)}100%{filter:none;opacity:1;transform:scale(1)}}\n@keyframes auraPop{0%{opacity:.05;transform:scale(.75)}60%{opacity:.75;transform:scale(1.08)}100%{opacity:.35;transform:scale(1)}}\n</style></head><body><div id=\"app\" class=\"app\"><div class=\"field-device\"><header class=\"device-header\"><div class=\"brand\"><div class=\"device-lens\" aria-hidden=\"true\"><i></i></div><div><h1>BioDex<span> FIELD-02</span></h1><div class=\"subtitle\">DISPOSITIVO DE EXPLORACIÓN / BIONOVA</div></div></div><div class=\"header-signals\"><span><i class=\"power-led\"></i> EN LÍNEA</span><button class=\"ghost\">Salir ↗</button></div></header><div class=\"device-layout\"><aside class=\"explorer-sidebar\"><button class=\"explorer-card\" aria-label=\"Personalizar explorador\"><div class=\"avatar-monitor\"><img class=\"avatar-sprite\" src=\"assets/avatars/aurora.png\" alt=\"Avatar Aurora\" loading=\"lazy\"><span class=\"avatar-coordinates\">ID / AURORA</span></div><strong>Exploradora Ada</strong><small>Aspirante</small><span class=\"edit-profile\">EDITAR PERFIL ↗</span></button><nav class=\"nav\" aria-label=\"Exploración\"><button class=\"\">⌂ Refugio</button><button class=\"\">▦ BioDex</button><button class=\"\">✧ Capturar</button><button class=\"\">⌖ Territorios</button><button class=\"\">◇ Gimnasios</button><button class=\"\">⇄ Evoluciones</button><button class=\"\">▣ Mochila</button><button class=\"\">★ Logros</button><button class=\"active\">? Guía</button></nav><div class=\"sidebar-counter\"><b>01</b><span>/ 30<br>BIOFORMAS</span><div class=\"progress\"><div style=\"width:3%\"></div></div></div></aside><section class=\"device-screen\"><div class=\"screen-status\"><span>⌖ Bosque Aurora</span><span id=\"cloudStatus\" role=\"status\">Sin sesión</span><button class=\"ghost\" aria-label=\"Actualizar progreso\">↻</button></div><main id=\"view\"><section class=\"rpg-window\"><span class=\"rpg-title\">Guía del explorador</span><h2>Tu próximo horizonte te espera.</h2><div class=\"grid two\"><article class=\"card\"><h3>01 / Sigue la travesía</h3><p>Explora los territorios de BioNova. Cada nuevo desafío puede acercarte a un código y a un hallazgo inesperado.</p></article><article class=\"card\"><h3>02 / Reúne códigos</h3><p>Los códigos CAP revelan bioformas; los SEC abren territorios y los GYM activan gimnasios de la Liga.</p></article><article class=\"card\"><h3>03 / Amplía tu colección</h3><p>Cada bioforma queda registrada antes de su aparición. Puedes capturar cualquier bioforma con su código, sin etapas previas ni gimnasios abiertos.</p></article><article class=\"card\"><h3>04 / Recupera tu expedición</h3><p>Usa el mismo nombre y clave de seis dígitos. Pulsa Actualizar si avanzaste desde otro dispositivo. Si pierdes la clave, tu docente puede restablecerla sin perder tu colección.</p></article><article class=\"card\"><h3>Conexión y guardado</h3><p>Sin conexión no se pueden registrar nuevos hallazgos. Si una solicitud tarda, vuelve a intentarlo: un mismo código nunca duplica tus hallazgos.</p></article><article class=\"card\"><h3>Efecto retro opcional</h3><p>Elige cómo se ve tu dispositivo. La textura CRT le da el acabado de una pantalla clásica.</p><button>Alternar textura CRT</button></article></div></section><section class=\"card\" style=\"margin-top:16px\"><h3>Tu identidad de explorador</h3><p>Cambia tu avatar, paisaje y textura de pantalla desde Perfil. Cada elección se guarda en tu cuenta.</p><button>Personalizar explorador →</button></section></main></section></div><footer class=\"device-bottom\"><div class=\"device-controls\"><span class=\"dpad\" aria-hidden=\"true\">✚</span><span>BIODEX / FIELD SYSTEM<br><small>EXPLORA · DESBLOQUEA · DESCUBRE</small></span></div><div class=\"physical-buttons\"><button aria-label=\"Capturar bioforma\">A</button><button aria-label=\"Abrir BioDex\">B</button></div><span class=\"speaker-grille\" aria-hidden=\"true\">||||||||</span></footer></div></div></body></html>"};function update(){const f=document.getElementById("reviewFrame");f.style.width=document.getElementById("width").value+"px";f.srcdoc=pages[document.getElementById("scene").value];}document.querySelectorAll("select").forEach(s=>s.onchange=update);update();</script></html>
